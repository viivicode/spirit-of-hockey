<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spirit of Hockey — International U20 Hockey Program in Finland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,500;0,600;0,700;1,800;1,900&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#040a17;
  --bg:#071127;
  --navy:#0a1834;
  --navy-2:#0d1f42;
  --navy-3:#122a58;
  --blue:#1d5fd8;
  --blue-bright:#3f8cff;
  --blue-glow:rgba(63,140,255,.55);
  --silver:#cfd9e6;
  --text:#eaf1fa;
  --muted:#9fb2cc;
  --metal:linear-gradient(135deg,#f2f6fb 0%,#8fa0b8 18%,#dfe7f0 34%,#66788f 52%,#e8eef5 70%,#7d8fa6 86%,#cfd8e3 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg-deep)}
body{
  font-family:'Barlow',sans-serif;color:var(--text);
  background:
    radial-gradient(1200px 600px at 75% 8%, rgba(45,110,220,.20), transparent 60%),
    radial-gradient(900px 500px at 12% 30%, rgba(30,80,180,.14), transparent 60%),
    radial-gradient(1400px 800px at 50% 110%, rgba(20,60,140,.18), transparent 65%),
    linear-gradient(180deg,#081228 0%,#050d1d 45%,#04091a 100%);
  min-height:100vh;overflow-x:hidden;
}
.wrap{width:min(1560px,96vw);margin:0 auto;position:relative}

/* ===== metallic frame (kuva-asset) ===== */
.metal{
  position:relative;border-radius:0;
  border:20px solid transparent;
  border-image:url("metallinen_futuristinen_kehys_valkoisella_taustall JANNE.png") 52 / 20px stretch;
  background:linear-gradient(180deg,rgba(10,24,52,.92),rgba(7,16,36,.96));
  background-clip:padding-box;
  box-shadow:0 10px 30px rgba(0,0,0,.55);
}

/* ===== chrome text ===== */
.chrome{
  background:linear-gradient(180deg,#ffffff 0%,#eef3f9 28%,#a9bacd 48%,#f4f8fc 54%,#8b9cb3 78%,#dfe7f0 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.65)) drop-shadow(0 0 24px rgba(120,170,255,.25));
}

/* ================= HEADER ================= */
header{padding:26px 0 8px;position:relative;z-index:5}
.header-row{display:flex;align-items:flex-start;gap:34px}
.logo-badge{flex:0 0 auto;margin-left:6px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.6))}
.logo-badge img{
  width:158px;height:auto;display:block;
  background:#fff;border-radius:16px;padding:10px 12px;
  box-shadow:0 10px 26px rgba(0,0,0,.55), 0 0 0 2px rgba(200,215,235,.55);
}
.foot-logo{
  width:78px;height:auto;display:block;
  background:#fff;border-radius:10px;padding:6px 7px;
  box-shadow:0 6px 16px rgba(0,0,0,.5);
}
nav.mainnav{
  flex:1;margin-top:14px;height:68px;border-radius:10px;
  background:url("kiiltävä_sininen_kromipalkki JANNE.png") no-repeat;
  background-size:100% 100%;
  box-shadow:0 12px 28px rgba(0,0,0,.55);
  display:flex;align-items:stretch;justify-content:space-around;padding:0 48px;
}
nav.mainnav a{
  display:flex;align-items:center;position:relative;
  color:var(--text);text-decoration:none;
  font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:20px;
  letter-spacing:.14em;padding:0 26px;
}
nav.mainnav a:hover{color:#fff;text-shadow:0 0 14px var(--blue-glow)}
nav.mainnav a.active{
  color:#fff;
  background:linear-gradient(180deg,rgba(63,140,255,.28),rgba(29,95,216,.10));
  text-shadow:0 0 16px var(--blue-glow);
}
nav.mainnav a.active::after{
  content:"";position:absolute;left:12%;right:12%;bottom:-2px;height:4px;border-radius:3px;
  background:linear-gradient(90deg,transparent,var(--blue-bright),transparent);
  box-shadow:0 0 18px 4px var(--blue-glow);
}

/* ================= HERO (koko sivun levyinen tausta) ================= */
.topbg{
  position:relative;
  background:url("ChatGPT Image 1.8.2026 klo 11.28.57.png") center top/cover no-repeat;
}
.topbg::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(4,10,25,.78) 0%,rgba(4,10,25,.42) 42%,rgba(4,10,25,.05) 70%),
    linear-gradient(180deg,rgba(4,10,25,.5) 0%,rgba(4,10,25,0) 20%,rgba(4,10,25,0) 60%,#050d1d 100%);
}
.topbg > *{position:relative;z-index:2}
.hero{display:block;position:relative;min-height:580px;padding:30px 10px 90px}
.hero-left{padding-left:10px;max-width:660px;margin-top:36px}
.hero-title{
  font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;
  font-size:clamp(64px,7.6vw,118px);line-height:.92;letter-spacing:.01em;text-transform:uppercase;
}
.hero-sub{
  margin:22px 0 30px;font-family:'Saira Condensed',sans-serif;font-weight:600;
  font-size:clamp(16px,1.5vw,23px);letter-spacing:.22em;color:#c9d6e6;
  text-shadow:0 2px 6px rgba(0,0,0,.6);
}
.hero-ctas{display:flex;gap:22px;flex-wrap:wrap}
.cta{
  display:flex;align-items:center;gap:16px;min-width:310px;
  padding:20px 34px 20px 26px;border-radius:16px;cursor:pointer;text-decoration:none;
  background:url("futuristinen_sininen_kehys JANNE.png") no-repeat;
  background-size:100% 100%;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.55));
  transition:transform .15s ease, filter .15s ease;
}
.cta:hover{transform:translateY(-2px);filter:drop-shadow(0 14px 28px rgba(0,0,0,.6)) drop-shadow(0 0 18px rgba(63,140,255,.45))}
.cta .ic{
  width:44px;height:44px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,#1d5fd8,#0b1e46);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 14px rgba(63,140,255,.4);
}
.cta .txt{font-family:'Saira Condensed',sans-serif;text-transform:uppercase;line-height:1.12}
.cta .txt small{display:block;font-size:15px;font-weight:600;letter-spacing:.1em;color:#c9d6e6}
.cta .txt strong{display:block;font-size:22px;font-weight:800;letter-spacing:.06em;color:#fff}

/* ================= INFO STRIP ================= */
.strip{
  display:grid;grid-template-columns:repeat(4,1fr);
  margin:6px 0 26px;padding:26px 34px;border-radius:18px;
  background:url("sininen_futuristinen_käyttöliittymäpaneeli JANNE.png") no-repeat;
  background-size:100% 100%;
  filter:drop-shadow(0 12px 28px rgba(0,0,0,.55));
}
.strip .cell{display:flex;gap:18px;align-items:center;padding:4px 26px;position:relative}
.strip .cell + .cell::before{
  content:"";position:absolute;left:0;top:12%;bottom:12%;width:1px;
  background:linear-gradient(180deg,transparent,rgba(180,200,225,.35),transparent);
}
.strip .icon{
  width:64px;height:64px;flex:0 0 auto;border-radius:50%;
  border:2px solid transparent;
  background:
    radial-gradient(circle at 35% 30%,#14305f,#081226) padding-box,
    var(--metal) border-box;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 18px rgba(63,140,255,.25), inset 0 1px 0 rgba(255,255,255,.15);
}
.strip h4{
  font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:17px;
  letter-spacing:.14em;color:#fff;margin-bottom:5px;
}
.strip p{font-size:14.5px;line-height:1.45;color:var(--muted);font-weight:500;letter-spacing:.04em}
.strip p b{color:#e5edf7;font-weight:700}
.strip .big{font-family:'Saira Condensed',sans-serif;font-size:34px;font-weight:800;color:#fff;line-height:1;margin:2px 0;text-shadow:0 0 16px rgba(63,140,255,.5)}

/* ================= PANELS ================= */
.panels{display:grid;grid-template-columns:1fr 1.02fr 1fr;gap:24px;margin-bottom:34px}
.panel{border-radius:18px;padding:20px 20px 22px}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;
  padding:12px 24px;
  background:url("kiiltävä_sininen_sci_fi_paneeli JANNE.png") no-repeat;
  background-size:100% 100%;
}
.panel-head h3{
  font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:21px;letter-spacing:.12em;color:#fff;
}
.panel-head a{
  color:var(--blue-bright);text-decoration:none;font-weight:700;font-size:13.5px;letter-spacing:.08em;
  font-family:'Saira Condensed',sans-serif;
}
.panel-head a:hover{text-shadow:0 0 12px var(--blue-glow)}

/* players */
.players{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pcard{
  border:1.5px solid transparent;border-radius:14px;overflow:hidden;position:relative;
  background:
    linear-gradient(180deg,#0f2148,#081226) padding-box,
    linear-gradient(160deg,#9fb0c5,#3a4a63,#c6d1de) border-box;
  box-shadow:0 8px 20px rgba(0,0,0,.5);
}
.pcard .num{
  position:absolute;top:8px;left:10px;z-index:2;
  font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;font-size:26px;color:#fff;
  text-shadow:0 0 12px rgba(63,140,255,.7),0 2px 3px rgba(0,0,0,.8);
}
.pcard .flag-top{position:absolute;top:12px;right:10px;z-index:2}
.pcard .photo{width:100%;aspect-ratio:1/1.02;display:block;background:radial-gradient(circle at 50% 20%,#1b3a72,#0a1a3a 70%)}
.pcard img.photo{object-fit:cover}
.pcard .info{padding:10px 8px 12px;text-align:center;background:linear-gradient(180deg,rgba(10,24,52,.6),rgba(6,12,26,.9))}
.pcard .info .name{
  font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:16.5px;letter-spacing:.08em;color:#fff;text-transform:uppercase;
}
.pcard .info .pos{
  margin-top:4px;font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:7px;text-transform:uppercase;
}
.flag{width:22px;height:14px;border-radius:2px;display:inline-block;box-shadow:0 0 0 1px rgba(255,255,255,.25),0 2px 4px rgba(0,0,0,.5)}
.flag.fi{background:linear-gradient(180deg,#fff 32%,#003580 32%,#003580 62%,#fff 62%),#fff;position:relative}
.flag.fi::after{content:"";position:absolute;left:28%;top:0;bottom:0;width:26%;background:#003580}
.flag.fi{background:#fff}
.flag.fi::before{content:"";position:absolute;left:0;right:0;top:36%;height:28%;background:#003580}
.flag.de{background:linear-gradient(180deg,#000 33%,#dd0000 33%,#dd0000 66%,#ffce00 66%)}
.flag.se{background:#005cbf;position:relative}
.flag.se::before{content:"";position:absolute;left:0;right:0;top:38%;height:24%;background:#fecc02}
.flag.se::after{content:"";position:absolute;left:30%;top:0;bottom:0;width:17%;background:#fecc02}
.flag.fi{position:relative}

/* schedule */
.sched{display:flex;flex-direction:column;gap:8px}
.srow{
  display:grid;grid-template-columns:58px 30px 1fr 86px 130px;align-items:center;gap:10px;
  background:url("sininen_futuristinen_käyttöliittymäpalkki JANNE.png") no-repeat;
  background-size:100% 100%;
  border-radius:10px;padding:13px 26px;
}
.srow:hover{filter:brightness(1.18) drop-shadow(0 0 10px rgba(63,140,255,.35))}
.srow .d{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.06em;color:#cfe0f5}
.srow .opp{font-weight:700;font-size:14px;letter-spacing:.05em;color:#fff;text-transform:uppercase}
.srow .t{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:14.5px;color:var(--blue-bright);letter-spacing:.05em}
.srow .a{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;text-align:right}
.badge{
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:10.5px;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 5px rgba(0,0,0,.5);
}

/* standings */
table.stand{width:100%;border-collapse:separate;border-spacing:0 7px}
table.stand th{
  font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:.12em;
  color:var(--muted);text-transform:uppercase;text-align:left;padding:2px 10px 4px;
}
table.stand th.c, table.stand td.c{text-align:center}
table.stand td{
  background:linear-gradient(180deg,rgba(18,42,88,.5),rgba(9,20,44,.7));
  padding:11px 10px;font-weight:600;font-size:14px;color:#dbe6f3;
  border-top:1px solid rgba(130,160,200,.16);border-bottom:1px solid rgba(130,160,200,.16);
}
table.stand td:first-child{border-left:1px solid rgba(130,160,200,.16);border-radius:10px 0 0 10px}
table.stand td:last-child{border-right:1px solid rgba(130,160,200,.16);border-radius:0 10px 10px 0;font-weight:800;color:#fff}
table.stand tr.me td{
  background:linear-gradient(90deg,#1d5fd8,#123c9a);color:#fff;
  border-color:rgba(120,170,255,.7);box-shadow:0 0 18px rgba(63,140,255,.35);
}
table.stand td .team{display:flex;align-items:center;gap:9px;text-transform:uppercase;font-family:'Saira Condensed',sans-serif;font-weight:700;letter-spacing:.06em;font-size:14.5px}

/* ================= FOOTER ================= */
footer{
  margin-top:10px;border-top:1px solid rgba(140,170,210,.25);
  background:linear-gradient(180deg,rgba(8,16,34,.9),rgba(4,9,20,.98));
  padding:30px 0 34px;
}
.foot-row{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.foot-id .fname{
  font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:.16em;color:#fff;
}
.foot-id .fsub{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--muted);margin-top:4px;text-transform:uppercase}
.foot-links{display:flex;gap:38px;margin-left:auto;margin-right:30px;flex-wrap:wrap}
.foot-links a{
  color:#cfe0f5;text-decoration:none;font-family:'Saira Condensed',sans-serif;
  font-weight:600;font-size:16px;letter-spacing:.14em;
}
.foot-links a:hover{color:#fff;text-shadow:0 0 12px var(--blue-glow)}
.socials{display:flex;gap:14px;padding-left:26px;border-left:1px solid rgba(140,170,210,.3)}
.socials a{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1.5px solid rgba(170,195,225,.5);color:#dbe6f3;transition:.15s;
}
.socials a:hover{border-color:var(--blue-bright);color:#fff;box-shadow:0 0 16px rgba(63,140,255,.4)}

@media(max-width:1200px){
  .panels{grid-template-columns:1fr}
  .strip{grid-template-columns:repeat(2,1fr);gap:18px 0}
  .strip .cell:nth-child(3)::before{display:none}
  .hero{padding:40px 26px 50px;min-height:520px}
  .header-row{flex-direction:column;align-items:center}
  nav.mainnav{width:100%;justify-content:center;flex-wrap:wrap;height:auto;padding:8px}
  nav.mainnav a{padding:10px 18px}
}
</style>
</head>
<body>

<div class="topbg">
<header class="wrap">
  <div class="header-row">
    <!-- LOGO -->
    <div class="logo-badge">
      <img src="spirit_of_hockey_logo.png" alt="Spirit of Hockey">
    </div>
    <!-- NAV (täytetään sisalto.js:stä) -->
    <nav class="mainnav" id="nav-valikko"></nav>
  </div>
</header>

<!-- HERO -->
<section class="wrap hero">
  <div class="hero-left">
    <h1 class="hero-title chrome"><span id="hero-rivi1"></span><br><span id="hero-rivi2"></span></h1>
    <p class="hero-sub" id="hero-alaotsikko"></p>
    <div class="hero-ctas">
      <a class="cta" id="hero-nappi1" href="#">
        <span class="ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </span>
        <span class="txt"><small></small><strong></strong></span>
      </a>
      <a class="cta" id="hero-nappi2" href="#">
        <span class="ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 19c0-3.5 3-5.4 6.5-5.4s6.5 1.9 6.5 5.4Z"/><circle cx="17" cy="8.5" r="2.6"/><path d="M16.5 13.2c2.9.2 5 1.9 5 4.8h-4"/></svg>
        </span>
        <span class="txt"><small></small><strong></strong></span>
      </a>
    </div>
  </div>
</section>
</div><!-- /topbg -->

<!-- INFO STRIP -->
<section class="wrap">
  <div class="strip">
    <div class="cell">
      <span class="icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/><rect x="7" y="12" width="3" height="3" fill="#fff" stroke="none"/><rect x="12" y="12" width="3" height="3" fill="#fff" stroke="none"/></svg>
      </span>
      <div>
        <h4 id="info1-otsikko"></h4>
        <p><b id="info1-r1"></b><br><span id="info1-r2"></span><br><span id="info1-r3"></span></p>
      </div>
    </div>
    <div class="cell">
      <span class="icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/></svg>
      </span>
      <div>
        <h4 id="info2-otsikko"></h4>
        <p><b id="info2-r1"></b><br><span id="info2-r2"></span><br><span id="info2-r3"></span></p>
      </div>
    </div>
    <div class="cell">
      <span class="icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
      </span>
      <div>
        <h4 id="info3-otsikko"></h4>
        <div class="big" id="info3-numero"></div>
        <p><b id="info3-alateksti"></b></p>
      </div>
    </div>
    <div class="cell">
      <span class="icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M4 12h16"/><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><rect x="5.5" y="7" width="3" height="10" rx="1"/><rect x="15.5" y="7" width="3" height="10" rx="1"/></svg>
      </span>
      <div>
        <h4 id="info4-otsikko"></h4>
        <p><span id="info4-r1"></span><br><span id="info4-r2"></span><br><span id="info4-r3"></span></p>
      </div>
    </div>
  </div>
</section>

<!-- PANELS -->
<section class="wrap panels">

  <!-- FEATURED PLAYERS (täytetään sisalto.js:stä) -->
  <div class="panel metal" id="team">
    <div class="panel-head">
      <h3 id="pelaajat-otsikko"></h3>
      <a id="pelaajat-linkki" href="#"></a>
    </div>
    <div class="players" id="pelaajat-lista"></div>
  </div>

  <!-- SCHEDULE (täytetään sisalto.js:stä) -->
  <div class="panel metal" id="schedule">
    <div class="panel-head">
      <h3 id="ottelut-otsikko"></h3>
      <a id="ottelut-linkki" href="#"></a>
    </div>
    <div class="sched" id="ottelut-lista"></div>
  </div>

  <!-- STANDINGS (täytetään sisalto.js:stä) -->
  <div class="panel metal" id="standings">
    <div class="panel-head">
      <h3 id="sarja-otsikko"></h3>
      <a id="sarja-linkki" href="#"></a>
    </div>
    <table class="stand">
      <thead>
        <tr><th class="c">#</th><th>TEAM</th><th class="c">GP</th><th class="c">W</th><th class="c">L</th><th class="c">OTL</th><th class="c">PTS</th></tr>
      </thead>
      <tbody id="sarja-rivit"></tbody>
    </table>
  </div>

</section>

<!-- FOOTER -->
<footer id="contact">
  <div class="wrap foot-row">
    <img class="foot-logo" src="spirit_of_hockey_logo.png" alt="Spirit of Hockey">
    <div class="foot-id">
      <div class="fname" id="footer-nimi"></div>
      <div class="fsub" id="footer-kuvaus"></div>
    </div>
    <div class="foot-links" id="footer-linkit"></div>
    <div class="socials">
      <a href="#" id="some-instagram" aria-label="Instagram">

<script src="sisalto.js"></script>
<script>
/* ==== Tämä skripti täyttää sivun sisalto.js:n tiedoilla. Älä muokkaa tätä — muokkaa sisalto.js-tiedostoa. ==== */
(function(){
  const S = SISALTO;
  const $ = id => document.getElementById(id);
  const badge = (t,v1,v2) => {
    const dark = /^#e/i.test(v1); // vaalea pallukka -> tumma teksti
    return '<span class="badge" style="background:radial-gradient(circle at 35% 30%,'+v1+','+v2+')'+(dark?';color:#0b1c3e':'')+'">'+t+'</span>';
  };
  const oletusKuva = () =>
    '<svg class="photo" viewBox="0 0 120 122" xmlns="http://www.w3.org/2000/svg">'+
    '<rect width="120" height="122" fill="#0e2148"/>'+
    '<circle cx="60" cy="30" r="60" fill="#1b3a72" opacity=".5"/>'+
    '<circle cx="60" cy="46" r="20" fill="#e9d5bd"/>'+
    '<path d="M40 44 q20 -16 40 -2 v-4 a20 20 0 0 0 -40 0 Z" fill="#3a2a18"/>'+
    '<path d="M20 122 q0 -40 40 -40 t40 40 Z" fill="#122a58"/>'+
    '<rect x="24" y="90" width="72" height="7" fill="#e8eef5"/>'+
    '<path d="M50 122 q10 -18 20 0 Z" fill="#fff" opacity=".9"/></svg>';

  /* sivun otsikko */
  document.title = S.sivunOtsikko;

  /* valikko */
  $('nav-valikko').innerHTML = S.valikko.map(v =>
    '<a href="'+v.linkki+'"'+(v.aktiivinen?' class="active"':'')+'>'+v.teksti+'</a>').join('');

  /* hero */
  $('hero-rivi1').textContent = S.hero.otsikkoRivi1;
  $('hero-rivi2').textContent = S.hero.otsikkoRivi2;
  $('hero-alaotsikko').textContent = S.hero.alaotsikko;
  [['hero-nappi1',S.hero.nappi1],['hero-nappi2',S.hero.nappi2]].forEach(([id,n])=>{
    const el = $(id);
    el.href = n.linkki;
    el.querySelector('small').textContent = n.pieniTeksti;
    el.querySelector('strong').textContent = n.isoTeksti;
  });

  /* infopalkki */
  const i = S.infopalkki;
  $('info1-otsikko').textContent=i.seuraavaPeli.otsikko;
  $('info1-r1').textContent=i.seuraavaPeli.rivi1; $('info1-r2').textContent=i.seuraavaPeli.rivi2; $('info1-r3').textContent=i.seuraavaPeli.rivi3;
  $('info2-otsikko').textContent=i.viimeisinTulos.otsikko;
  $('info2-r1').textContent=i.viimeisinTulos.rivi1; $('info2-r2').textContent=i.viimeisinTulos.rivi2; $('info2-r3').textContent=i.viimeisinTulos.rivi3;
  $('info3-otsikko').textContent=i.kansainvalisetPelaajat.otsikko;
  $('info3-numero').textContent=i.kansainvalisetPelaajat.iso_numero;
  $('info3-alateksti').textContent=i.kansainvalisetPelaajat.alateksti;
  $('info4-otsikko').textContent=i.treenit.otsikko;
  $('info4-r1').textContent=i.treenit.rivi1; $('info4-r2').textContent=i.treenit.rivi2; $('info4-r3').textContent=i.treenit.rivi3;

  /* pelaajat */
  $('pelaajat-otsikko').textContent = S.pelaajat.otsikko;
  const pl = $('pelaajat-linkki'); pl.textContent = S.pelaajat.linkkiTeksti; pl.href = S.pelaajat.linkki;
  $('pelaajat-lista').innerHTML = S.pelaajat.lista.map(p =>
    '<div class="pcard">'+
      '<span class="num">'+p.numero+'</span>'+
      '<span class="flag-top"><span class="flag '+p.lippu+'"></span></span>'+
      (p.kuva ? '<img class="photo" src="'+p.kuva+'" alt="'+p.nimi+'">' : oletusKuva())+
      '<div class="info">'+
        '<div class="name">'+p.nimi+'</div>'+
        '<div class="pos">'+p.pelipaikka+' • '+p.maa+' <span class="flag '+p.lippu+'"></span></div>'+
      '</div>'+
    '</div>').join('');

  /* ottelut */
  $('ottelut-otsikko').textContent = S.ottelut.otsikko;
  const ol = $('ottelut-linkki'); ol.textContent = S.ottelut.linkkiTeksti; ol.href = S.ottelut.linkki;
  $('ottelut-lista').innerHTML = S.ottelut.lista.map(o =>
    '<div class="srow">'+
      '<span class="d">'+o.pvm+'</span>'+
      badge(o.lyhenne,o.vari1,o.vari2)+
      '<span class="opp">'+o.vastustaja+'</span>'+
      '<span class="t">'+o.aika+'</span>'+
      '<span class="a">'+o.halli+'</span>'+
    '</div>').join('');

  /* sarjataulukko */
  $('sarja-otsikko').textContent = S.sarjataulukko.otsikko;
  const sl = $('sarja-linkki'); sl.textContent = S.sarjataulukko.linkkiTeksti; sl.href = S.sarjataulukko.linkki;
  $('sarja-rivit').innerHTML = S.sarjataulukko.joukkueet.map(j =>
    '<tr'+(j.oma?' class="me"':'')+'>'+
      '<td class="c">'+j.sija+'</td>'+
      '<td><span class="team">'+badge(j.lyhenne,j.vari1,j.vari2)+j.nimi+'</span></td>'+
      '<td class="c">'+j.o+'</td><td class="c">'+j.v+'</td><td class="c">'+j.h+'</td>'+
      '<td class="c">'+j.jv+'</td><td class="c">'+j.p+'</td>'+
    '</tr>').join('');

  /* footer */
  $('footer-nimi').textContent = S.footer.nimi;
  $('footer-kuvaus').textContent = S.footer.kuvaus;
  $('footer-linkit').innerHTML = S.footer.linkit.map(l =>
    '<a href="'+l.linkki+'">'+l.teksti+'</a>').join('');
  $('some-instagram').href = S.footer.some.instagram;
  $('some-youtube').href = S.footer.some.youtube;
  $('some-x').href = S.footer.some.x;
  $('some-sposti').href = 'mailto:'+S.footer.some.sahkoposti;
})();
</script>
